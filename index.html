<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Seguro - Alarma ESP32</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .hidden { display: none !important; }
        
        /* Estilo del Login */
        #login-screen { background: #1e293b; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 300px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
        
        /* Estilo del Panel Principal */
        #main-panel { width: 90%; max-width: 800px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 15px; border: 1px solid #334155; flex: 1; min-width: 300px; text-align: center; }
        
        .btn { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .on { background: #10b981; color: white; }
        .off { background: #ef4444; color: white; }
        #dist { font-size: 3rem; color: #10b981; margin: 10px 0; }
        
        ul { list-style: none; padding: 0; text-align: left; max-height: 200px; overflow-y: auto; }
        li { padding: 8px; border-bottom: 1px solid #334155; font-size: 0.8rem; color: #cbd5e1; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>🔐 Iniciar Sesión</h2>
        <p>Introduce tus credenciales de HiveMQ</p>
        <input type="text" id="mqtt_user" placeholder="Usuario (Ej: Esp-32)">
        <input type="password" id="mqtt_pass" placeholder="Contraseña">
        <button class="btn on" onclick="conectar()">ENTRAR</button>
        <p id="login-err" style="color: #ef4444; font-size: 0.8rem;"></p>
    </div>

    <div id="main-panel" class="hidden">
        <div class="card">
            <h3 id="welcome-msg">Bienvenido</h3>
            <div id="stat" style="color: #10b981;">● SISTEMA CONECTADO</div>
            <div id="dist">0 mm</div>
            <button class="btn on" onclick="enviar('ON')">ARMAR SISTEMA</button>
            <button class="btn off" onclick="enviar('OFF')">DESARMAR / RESET</button>
        </div>

        <div class="card">
            <h3>Historial (Últimos 10)</h3>
            <ul id="logList"><li>Esperando actividad...</li></ul>
        </div>
    </div>

    <script>
        let client;
        let historial = [];
        let usuarioActual = "";
        const host = "7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud";

        function conectar() {
            usuarioActual = document.getElementById("mqtt_user").value;
            const password = document.getElementById("mqtt_pass").value;
            const loginErr = document.getElementById("login-err");

            if(!usuarioActual || !password) {
                loginErr.innerText = "Por favor completa ambos campos.";
                return;
            }

            loginErr.innerText = "Verificando...";

            client = new Paho.MQTT.Client(host, 8884, "web_" + Math.random().toString(16).substr(2, 4));

            client.onMessageArrived = onMessage;
            client.onConnectionLost = (obj) => { location.reload(); };

            client.connect({
                useSSL: true,
                userName: usuarioActual,
                password: password,
                onSuccess: () => {
                    document.getElementById("login-screen").classList.add("hidden");
                    document.getElementById("main-panel").classList.remove("hidden");
                    document.getElementById("welcome-msg").innerText = "Operador: " + usuarioActual;
                    
                    client.subscribe("esp32/distancia");
                    client.subscribe("esp32/estado");
                    client.subscribe("esp32/log");
                },
                onFailure: (err) => {
                    loginErr.innerText = "Error: Usuario o contraseña incorrectos.";
                    console.log(err);
                }
            });
        }

        function onMessage(msg) {
            if (msg.destinationName == "esp32/distancia") {
                document.getElementById("dist").innerText = msg.payloadString + " mm";
            }
            if (msg.destinationName == "esp32/log") {
                const ahora = new Date().toLocaleTimeString();
                historial.unshift(ahora + " - " + msg.payloadString);
                if (historial.length > 10) historial.pop();
                document.getElementById("logList").innerHTML = historial.map(i => `<li>${i}</li>`).join("");
            }
        }

        function enviar(accion) {
            let mensaje = new Paho.MQTT.Message(usuarioActual + ":" + accion);
            mensaje.destinationName = "esp32/comando";
            client.send(mensaje);
        }
    </script>
</body>
</html>
