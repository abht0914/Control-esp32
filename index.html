<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consola de Seguridad Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --green: #10b981; --red: #ef4444; --blue: #3b82f6; --orange: #f59e0b; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: var(--card); padding: 30px; border-radius: 20px; width: 400px; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .status-header { display: flex; align-items: center; justify-content: center; background: #0f172a; padding: 12px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #1e293b; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #475569; margin-right: 12px; transition: 0.3s; }
        .online { background: var(--green); box-shadow: 0 0 12px var(--green); }
        #log { background: #000; height: 160px; overflow-y: auto; padding: 12px; font-family: 'Courier New', monospace; font-size: 0.85rem; color: var(--green); border: 1px solid #475569; margin: 15px 0; border-radius: 8px; }
        .btn { width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: white; transition: transform 0.1s, opacity 0.2s; font-size: 1rem; }
        .btn:active { transform: scale(0.98); opacity: 0.8; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .label-status { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="login" class="card">
        <h2 style="margin-top:0">🔒 Seguridad IoT</h2>
        <input type="text" id="user" placeholder="Nombre de Operador">
        <input type="password" id="pass" placeholder="Password MQTT">
        <button class="btn" style="background: var(--green)" onclick="conectar()">ACCEDER AL PANEL</button>
    </div>

    <div id="panel" class="card" style="display:none;">
        <div class="status-header">
            <div id="con-dot" class="dot"></div>
            <span id="con-text" style="font-size: 0.9rem; font-weight: bold;">ESP32: DESCONECTADO</span>
        </div>
        
        <div style="text-align: center; margin-bottom: 10px;">
            <div class="label-status">Estado del Sistema</div>
            <div id="sys-state" style="font-size: 1.5rem; font-weight: bold; color: var(--orange);">---</div>
        </div>

        <div id="log"></div>

        <button class="btn" style="background: var(--blue)" onclick="enviar('ARMAR')">🛡️ ARMAR SISTEMA</button>
        <button class="btn" style="background: var(--orange)" onclick="enviar('ACTIVAR')">🚨 PÁNICO / ACTIVAR</button>
        <button class="btn" style="background: var(--red)" onclick="enviar('APAGAR')">✖️ DESACTIVAR / RESET</button>
    </div>

    <script>
        let mqtt;
        let user = "";
        const host = "7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud";

        function conectar() {
            user = document.getElementById("user").value;
            const p = document.getElementById("pass").value;
            if(!user) return alert("Ingresa tu nombre");

            mqtt = new Paho.MQTT.Client("wss://" + host + ":8884/mqtt", "Web_" + Math.random());

            mqtt.onMessageArrived = (msg) => {
                const payload = msg.payloadString;
                const topic = msg.destinationName;

                if (topic === "esp32/link") {
                    const isOnline = payload === "ONLINE";
                    document.getElementById("con-dot").className = "dot" + (isOnline ? " online" : "");
                    document.getElementById("con-text").innerText = "ESP32: " + (isOnline ? "CONECTADO" : "DESCONECTADO");
                }
                if (topic === "esp32/estado") {
                    document.getElementById("sys-state").innerText = payload;
                }
                if (topic === "esp32/log") {
                    const log = document.getElementById("log");
                    const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                    log.innerHTML += `<div><span style="color:#64748b">[${time}]</span> ${payload.replace('|', ': ')}</div>`;
                    log.scrollTop = log.scrollHeight;
                }
            };

            mqtt.connect({ useSSL: true, userName: user, password: p, 
                onSuccess: () => {
                    document.getElementById("login").style.display = "none";
                    document.getElementById("panel").style.display = "block";
                    mqtt.subscribe("esp32/link");
                    mqtt.subscribe("esp32/estado");
                    mqtt.subscribe("esp32/log");
                },
                onFailure: (e) => alert("Error de conexión: " + e.errorMessage)
            });
        }

        function enviar(cmd) {
            const m = new Paho.MQTT.Message(user + ":" + cmd);
            m.destinationName = "esp32/comando";
            m.qos = 0; 
            mqtt.send(m);
            
            // Feedback visual de envío
            if(cmd === "APAGAR") document.getElementById("sys-state").innerText = "APAGANDO...";
        }
    </script>
</body>
</html>
