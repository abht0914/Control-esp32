<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Alarma</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0f0f0f; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .panel { background-color: #1a1a1a; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; width: 320px; border: 1px solid #333; }
        h1 { font-size: 1.4rem; color: #00ff88; margin-bottom: 20px; }
        .status-box { margin: 15px 0; padding: 15px; border-radius: 12px; background: #252525; font-size: 0.9rem; border: 1px solid #444; }
        #stat { font-weight: bold; color: #f1c40f; }
        .btn { width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; }
        .btn-on { background-color: #27ae60; color: white; }
        .btn-off { background-color: #e74c3c; color: white; }
        .btn:active { transform: scale(0.96); }
        #dist { font-size: 1.2rem; color: #00ff88; font-weight: bold; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>🛡️ ALARMA LÁSER</h1>
        <div class="status-box">ESTADO: <span id="stat">CONECTANDO...</span></div>
        <div class="status-box">DISTANCIA: <span id="dist">0</span> mm</div>
        
        <button class="btn btn-on" onclick="enviar('ON')">ARMAR SISTEMA</button>
        <button class="btn btn-off" onclick="enviar('OFF')">DESARMAR / RESET</button>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        const host = "7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud";
        const port = 8884; 
        const user = "Esp-32"; 
        const pass = "Controltotal1";
        
        // Generar un ID de cliente único para evitar desconexiones
        const clientId = "web_user_" + Math.random().toString(16).substr(2, 4);
        const client = new Paho.MQTT.Client(host, port, clientId);

        client.onConnectionLost = (obj) => { 
            document.getElementById("stat").innerText = "DESCONECTADO ❌";
            document.getElementById("stat").style.color = "#e74c3c";
            console.log("Conexión perdida: " + obj.errorMessage);
        };

        client.onMessageArrived = (msg) => {
            if (msg.destinationName === "esp32/distancia") {
                document.getElementById("dist").innerText = msg.payloadString;
            }
            if (msg.destinationName === "esp32/estado") {
                document.getElementById("stat").innerText = msg.payloadString;
                document.getElementById("stat").style.color = "#00ff88";
            }
        };

        const opciones = {
            useSSL: true,
            userName: user,
            password: pass,
            onSuccess: () => {
                console.log("Conectado con éxito");
                document.getElementById("stat").innerText = "EN LÍNEA ✅";
                document.getElementById("stat").style.color = "#00ff88";
                client.subscribe("esp32/distancia");
                client.subscribe("esp32/estado");
            },
            onFailure: (e) => { 
                console.log("Error de conexión:", e);
                document.getElementById("stat").innerText = "ERROR DE DATOS ❌";
                document.getElementById("stat").style.color = "#e74c3c";
            }
        };

        client.connect(opciones);

        function enviar(comando) {
            if (!client.isConnected()) {
                alert("Aún no hay conexión con el servidor.");
                return;
            }
            const message = new Paho.MQTT.Message(comando);
            message.destinationName = "esp32/comando";
            client.send(message);
        }
    </script>
</body>
</html>
