<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Seguridad Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: var(--card); padding: 30px; border-radius: 20px; width: 340px; text-align: center; border: 1px solid #334155; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        /* Estilos de Estado */
        #state-txt { padding: 12px; border-radius: 10px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; transition: 0.3s; border: 1px solid rgba(255,255,255,0.1); }
        .st-conectando { background: #64748b; color: white; }
        .st-apagado { background: #1e293b; color: #94a3b8; border-color: #334155; }
        .st-armado { background: #064e3b; color: #10b981; border-color: #10b981; }
        .st-alarma { background: #7f1d1d; color: #ef4444; border-color: #ef4444; animation: blink 1s infinite; }
        
        @keyframes blink { 50% { opacity: 0.6; } }
        
        #dist { font-size: 5rem; font-weight: bold; color: #f8fafc; margin: 5px 0; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin: 8px 0; color: white; transition: 0.2s; }
        .btn-arm { background: #10b981; } .btn-panic { background: #f59e0b; } .btn-off { background: #ef4444; }
        .btn:active { transform: scale(0.96); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login" class="card">
        <h2>🔒 PANEL ACCESO</h2>
        <input type="text" id="u" placeholder="Usuario HiveMQ" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; background:#0f172a; color:white; border:1px solid #334155;">
        <input type="password" id="p" placeholder="Contraseña" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; background:#0f172a; color:white; border:1px solid #334155;">
        <button class="btn btn-arm" onclick="conectar()">CONECTAR SISTEMA</button>
    </div>

    <div id="panel" class="card hidden">
        <div id="state-txt" class="st-conectando">CONECTANDO...</div>
        
        <div id="dist">--</div>
        <div style="color:#64748b; font-size:0.8rem; margin-bottom:20px;">SENSOR VL53L0X (mm)</div>
        
        <button class="btn btn-arm" onclick="enviar('ARMAR')">🛡️ ARMAR SISTEMA</button>
        <button class="btn btn-panic" onclick="enviar('ACTIVAR')">🚨 PÁNICO MANUAL</button>
        <button class="btn btn-off" onclick="enviar('APAGAR')">✖️ APAGAR / RESET</button>
    </div>

    <script>
        let client;
        let user;

        function actualizarUIEstado(estado) {
            const el = document.getElementById('state-txt');
            el.innerText = estado;
            // Limpiar clases
            el.className = "";
            if(estado === "CONECTANDO") el.classList.add('st-conectando');
            else if(estado === "APAGADO") el.classList.add('st-apagado');
            else if(estado === "ARMADO") el.classList.add('st-armado');
            else if(estado === "ALARMA") el.classList.add('st-alarma');
        }

        function conectar() {
            user = document.getElementById('u').value;
            let pass = document.getElementById('p').value;
            client = new Paho.MQTT.Client("7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud", 8884, "web_" + Math.random().toString(16).substr(2,4));

            client.onMessageArrived = (m) => {
                if(m.destinationName == "esp32/distancia") document.getElementById('dist').innerText = m.payloadString;
                if(m.destinationName == "esp32/estado") actualizarUIEstado(m.payloadString);
            };

            client.connect({
                useSSL: true, userName: user, password: pass,
                onSuccess: () => {
                    document.getElementById('login').classList.add('hidden');
                    document.getElementById('panel').classList.remove('hidden');
                    // Al conectar con éxito, mostramos conectando hasta recibir el primer estado real del ESP32
                    actualizarUIEstado("CONECTANDO"); 
                    client.subscribe("esp32/distancia");
                    client.subscribe("esp32/estado");
                },
                onFailure: () => alert("Error de conexión")
            });
        }

        function enviar(cmd) {
            let m = new Paho.MQTT.Message(user + ":" + cmd);
            m.destinationName = "esp32/comando";
            client.send(m);
        }
    </script>
</body>
</html>
