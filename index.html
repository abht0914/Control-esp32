<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Restringido - Alarma</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .hidden { display: none !important; }
        #login-box { background: #1e293b; padding: 30px; border-radius: 15px; text-align: center; width: 300px; border: 1px solid #334155; }
        #main-panel { display: flex; flex-direction: column; gap: 20px; width: 90%; max-width: 600px; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #334155; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        .btn { width: 100%; padding: 15px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; margin-top: 10px; }
        .on { background: #10b981; color: white; }
        .off { background: #ef4444; color: white; }
        #dist { font-size: 3rem; color: #10b981; }
        ul { list-style: none; padding: 0; text-align: left; background: #0f172a; border-radius: 10px; padding: 10px; }
        li { font-size: 0.8rem; padding: 5px; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>

    <div id="login-box">
        <h2>🔐 Seguridad</h2>
        <input type="text" id="u" placeholder="Usuario HiveMQ">
        <input type="password" id="p" placeholder="Contraseña">
        <button class="btn on" onclick="login()">ENTRAR</button>
        <p id="err" style="color: #ef4444; font-size: 0.8rem;"></p>
    </div>

    <div id="main-panel" class="hidden">
        <div class="card">
            <h3 id="user-tag">Operador: ---</h3>
            <div id="dist">0 mm</div>
            <button class="btn on" onclick="enviar('ON')">ARMAR</button>
            <button class="btn off" onclick="enviar('OFF')">DESARMAR / RESET</button>
        </div>
        <div class="card">
            <h4>Historial</h4>
            <ul id="logList"></ul>
        </div>
    </div>

    <script>
        let mqtt;
        let user;
        let logs = [];

        function login() {
            user = document.getElementById("u").value;
            let pass = document.getElementById("p").value;
            let msg = document.getElementById("err");

            if(!user || !pass) { msg.innerText = "Escribe tus datos"; return; }
            msg.innerText = "Autenticando...";

            // NO CREAMOS EL CLIENTE HASTA QUE SE DA CLICK
            mqtt = new Paho.MQTT.Client("7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud", 8884, "web_" + Math.random().toString(16).substr(2, 5));

            mqtt.onMessageArrived = (m) => {
                if(m.destinationName == "esp32/distancia") document.getElementById("dist").innerText = m.payloadString + " mm";
                if(m.destinationName == "esp32/log") {
                    logs.unshift(new Date().toLocaleTimeString() + " - " + m.payloadString);
                    if(logs.length > 10) logs.pop();
                    document.getElementById("logList").innerHTML = logs.map(l => `<li>${l}</li>`).join("");
                }
            };

            mqtt.connect({
                useSSL: true, userName: user, password: pass,
                onSuccess: () => {
                    document.getElementById("login-box").classList.add("hidden");
                    document.getElementById("main-panel").classList.remove("hidden");
                    document.getElementById("user-tag").innerText = "Operador: " + user;
                    mqtt.subscribe("esp32/distancia");
                    mqtt.subscribe("esp32/log");
                },
                onFailure: () => { msg.innerText = "Acceso Denegado ❌"; }
            });
        }

        function enviar(acc) {
            let m = new Paho.MQTT.Message(user + ":" + acc);
            m.destinationName = "esp32/comando";
            mqtt.send(m);
        }
    </script>
</body>
</html>
