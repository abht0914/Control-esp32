<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Control Alarma ESP32</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #121212; color: white; text-align: center; font-family: sans-serif; padding-top: 50px; }
        .box { border: 2px solid #00ff88; display: inline-block; padding: 30px; border-radius: 15px; background: #1a1a1a; }
        button { padding: 15px 25px; margin: 10px; cursor: pointer; font-weight: bold; border-radius: 8px; border: none; font-size: 16px; }
        .on { background: #27ae60; color: white; }
        .off { background: #e74c3c; color: white; }
        #stat { color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🛡️ SISTEMA LÁSER</h1>
        <p id="stat">ESTADO: CONECTANDO...</p>
        <p>Distancia: <span id="dist">0</span> mm</p>
        <button class="on" onclick="enviar('ON')">ARMAR SISTEMA</button>
        <button class="off" onclick="enviar('OFF')">DESARMAR / RESET</button>
    </div>

    <script>
        // --- REVISA BIEN ESTOS DATOS ---
        const host = "7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud";
        const port = 8884; 
        const user = "TU_USUARIO_ACCESS"; // El que creaste en Access Management
        const pass = "TU_PASS_ACCESS";    // La contraseña que creaste allí

        const client = new Paho.MQTT.Client(host, port, "web_client_" + Math.random().toString(16).substr(2, 4));
        
        client.onMessageArrived = (msg) => {
            if (msg.destinationName == "esp32/distancia") document.getElementById("dist").innerText = msg.payloadString;
            if (msg.destinationName == "esp32/estado") document.getElementById("stat").innerText = "ESTADO: " + msg.payloadString;
        };

        client.onConnectionLost = (responseObject) => {
            document.getElementById("stat").innerText = "ESTADO: CONEXIÓN PERDIDA";
            console.log("Error:", responseObject.errorMessage);
        };

        const options = {
            useSSL: true,
            userName: user,
            password: pass,
            onSuccess: () => {
                document.getElementById("stat").innerText = "ESTADO: CONECTADO ✅";
                document.getElementById("stat").style.color = "#00ff88";
                client.subscribe("esp32/distancia");
                client.subscribe("esp32/estado");
            },
            onFailure: (err) => {
                document.getElementById("stat").innerText = "ESTADO: ERROR DE DATOS ❌";
                console.log("Fallo total de conexión:", err);
            }
        };

        client.connect(options);

        function enviar(val) {
            if (!client.isConnected()) {
                alert("Todavía no hay conexión con la nube. Espera un momento.");
                return;
            }
            let m = new Paho.MQTT.Message(val);
            m.destinationName = "esp32/comando";
            client.send(m);
        }
    </script>
</body>
</html>
