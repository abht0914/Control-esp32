<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control Profesional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; text-align: center; width: 450px; }
        #dist { font-size: 3.5rem; color: #10b981; font-weight: bold; margin: 15px 0; }
        .btn { width: 100%; padding: 12px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; margin: 5px 0; color: white; }
        .hidden { display: none; }
        table { width: 100%; font-size: 0.75rem; border-collapse: collapse; margin-top: 15px; }
        th { border-bottom: 1px solid #475569; color: #94a3b8; padding: 8px; }
        td { padding: 8px; border-bottom: 1px solid #1e293b; text-align: center; }
        tr:first-child td { color: #10b981; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-box" class="card">
        <h2>🔐 Seguridad</h2>
        <input type="text" id="u" placeholder="Usuario" style="width:80%; padding:10px; margin-bottom:10px;">
        <input type="password" id="p" placeholder="Password" style="width:80%; padding:10px;">
        <button class="btn" style="background:#10b981; margin-top:15px;" onclick="login()">ENTRAR</button>
    </div>

    <div id="main-panel" class="hidden">
        <div class="card">
            <h3 id="user-tag" style="margin:0; color:#94a3b8; font-size: 0.9rem;">---</h3>
            <div id="stat" style="color:#f59e0b; margin: 10px 0;">SINCRONIZANDO...</div>
            <div id="dist">0 mm</div>
            <button class="btn" style="background:#10b981;" onclick="enviar('ARMAR')">🛡️ ARMAR</button>
            <button class="btn" style="background:#f59e0b;" onclick="enviar('ACTIVAR')">🚨 PÁNICO</button>
            <button class="btn" style="background:#ef4444;" onclick="enviar('APAGAR')">✖️ RESET</button>
            
            <h4 style="margin: 20px 0 10px 0; color:#94a3b8;">Últimos 10 Eventos</h4>
            <table>
                <thead>
                    <tr>
                        <th>Fecha/Hora</th>
                        <th>Usuario</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="logBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let mqtt; let user;
        const host = "7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud";
        let logs = [];

        function login() {
            user = document.getElementById("u").value;
            let pass = document.getElementById("p").value;
            mqtt = new Paho.MQTT.Client(host, 8884, "web_" + Math.random().toString(16).substr(2, 4));
            
            mqtt.onMessageArrived = (m) => {
                if(m.destinationName == "esp32/distancia") document.getElementById("dist").innerText = m.payloadString + " mm";
                if(m.destinationName == "esp32/estado") document.getElementById("stat").innerText = m.payloadString;
                
                if(m.destinationName == "esp32/log") {
                    const data = m.payloadString.split("|"); // Separamos Usuario y Acción
                    const now = new Date();
                    const fechaHora = now.toLocaleDateString() + " " + now.toLocaleTimeString();
                    
                    const nuevoEvento = { fh: fechaHora, u: data[0], a: data[1] };
                    logs.unshift(nuevoEvento);
                    if(logs.length > 10) logs.pop();
                    
                    actualizarTabla();
                }
            };

            mqtt.connect({ useSSL: true, userName: user, password: pass,
                onSuccess: () => {
                    document.getElementById("login-box").classList.add("hidden");
                    document.getElementById("main-panel").classList.remove("hidden");
                    document.getElementById("user-tag").innerText = "OPERADOR: " + user.toUpperCase();
                    mqtt.subscribe("esp32/distancia");
                    mqtt.subscribe("esp32/log");
                    mqtt.subscribe("esp32/estado");
                }
            });
        }

        function actualizarTabla() {
            const body = document.getElementById("logBody");
            body.innerHTML = logs.map(l => `
                <tr>
                    <td>${l.fh}</td>
                    <td>${l.u}</td>
                    <td>${l.a}</td>
                </tr>
            `).join("");
        }

        function enviar(acc) {
            let m = new Paho.MQTT.Message(user + ":" + acc);
            m.destinationName = "esp32/comando";
            mqtt.send(m);
        }
    </script>
</body>
</html>
