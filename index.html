<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control Base</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 25px; border-radius: 15px; width: 380px; border: 1px solid #334155; }
        .status-header { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; background: #0f172a; padding: 10px; border-radius: 10px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #475569; margin-right: 10px; }
        .online { background: #10b981; box-shadow: 0 0 10px #10b981; }
        #log { background: #000; height: 150px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 0.8rem; color: #10b981; border: 1px solid #475569; margin: 15px 0; border-radius: 5px; }
        .btn { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
        input { width: 93%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; }
    </style>
</head>
<body>

    <div id="login" class="card">
        <h3>🔐 Identificación</h3>
        <input type="text" id="user" placeholder="Nombre de Usuario">
        <input type="password" id="pass" placeholder="Clave MQTT">
        <button class="btn" style="background:#10b981" onclick="conectar()">ENTRAR</button>
    </div>

    <div id="panel" class="card" style="display:none;">
        <div class="status-header">
            <div id="con-dot" class="dot"></div>
            <span id="con-text">ESP32: DESCONECTADO</span>
        </div>
        
        <div style="text-align: center; font-weight: bold; color: #f59e0b;">
            ESTADO ACTUAL: <span id="sys-state">---</span>
        </div>

        <div id="log"></div>

        <button class="btn" style="background:#3b82f6" onclick="enviar('ARMAR')">🛡️ ARMAR</button>
        <button class="btn" style="background:#f59e0b" onclick="enviar('ACTIVAR')">🚨 ACTIVAR (PÁNICO)</button>
        <button class="btn" style="background:#ef4444" onclick="enviar('APAGAR')">✖️ DESACTIVAR</button>
    </div>

    <script>
        let mqtt;
        let user = "";

        function conectar() {
            user = document.getElementById("user").value;
            const p = document.getElementById("pass").value;
            mqtt = new Paho.MQTT.Client("wss://7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud:8884/mqtt", "Web_" + Math.random());

            mqtt.onMessageArrived = (msg) => {
                const payload = msg.payloadString;
                const topic = msg.destinationName;

                if (topic === "esp32/link") {
                    const isOnline = payload === "ONLINE";
                    document.getElementById("con-dot").className = "dot" + (isOnline ? " online" : "");
                    document.getElementById("con-text").innerText = "ESP32: " + (isOnline ? "CONECTADO" : "DESCONECTADO");
                }
                if (topic === "esp32/estado") {
                    document.getElementById("sys-state").innerText = payload;
                }
                if (topic === "esp32/log") {
                    const log = document.getElementById("log");
                    log.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${payload.replace('|', ': ')}</div>`;
                    log.scrollTop = log.scrollHeight;
                }
            };

            mqtt.connect({ useSSL: true, userName: user, password: p, 
                onSuccess: () => {
                    document.getElementById("login").style.display = "none";
                    document.getElementById("panel").style.display = "block";
                    mqtt.subscribe("esp32/link");
                    mqtt.subscribe("esp32/estado");
                    mqtt.subscribe("esp32/log");
                }
            });
        }

        function enviar(cmd) {
            const m = new Paho.MQTT.Message(user + ":" + cmd);
            m.destinationName = "esp32/comando";
            mqtt.send(m);
        }
    </script>
</body>
</html>
