<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consola de Seguridad Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --green: #10b981; --red: #ef4444; --blue: #3b82f6; --orange: #f59e0b; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: var(--card); padding: 30px; border-radius: 20px; width: 380px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .status-header { display: flex; flex-direction: column; align-items: center; background: #0f172a; padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #1e293b; }
        .connection-row { display: flex; align-items: center; margin-bottom: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #475569; margin-right: 10px; }
        .online { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .user-badge { font-size: 0.75rem; color: #94a3b8; font-weight: bold; background: #1e293b; padding: 2px 8px; border-radius: 4px; border: 1px solid #334155; }
        #log { background: #000; height: 180px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 0.8rem; border: 1px solid #475569; margin: 15px 0; border-radius: 8px; color: #cbd5e1; }
        .btn { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn:active { transform: scale(0.98); opacity: 0.8; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="login" class="card">
        <h2 style="text-align: center; margin-top: 0;">🔒 Acceso Seguridad</h2>
        <input type="text" id="user" placeholder="Nombre de Operador">
        <input type="password" id="pass" placeholder="Password MQTT">
        <button class="btn" style="background: var(--green)" onclick="conectar()">ENTRAR AL PANEL</button>
    </div>

    <div id="panel" class="card" style="display:none;">
        <div class="status-header">
            <div class="connection-row">
                <div id="con-dot" class="dot"></div>
                <span id="con-text" style="font-size: 0.8rem; font-weight: bold;">ESP32: DESCONECTADO</span>
            </div>
            <div id="operator-display" class="user-badge">OPERADOR: ---</div>
        </div>

        <div style="text-align: center;">
            <div id="sys-state" style="font-size: 1.4rem; font-weight: bold; color: var(--orange);">CONECTANDO...</div>
        </div>

        <div id="log"></div>

        <button class="btn" style="background: var(--blue)" onclick="enviar('ARMAR')">🛡️ ARMAR SISTEMA</button>
        <button class="btn" style="background: var(--orange)" onclick="enviar('ACTIVAR')">🚨 PÁNICO / ACTIVAR</button>
        <button class="btn" style="background: var(--red)" onclick="enviar('APAGAR')">✖️ DESACTIVAR / RESET</button>
    </div>

    <script>
        let mqtt;
        let user = "";
        const host = "7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud";

        // Carga el historial desde LocalStorage
        function cargarHistorial() {
            const logBox = document.getElementById("log");
            const guardados = JSON.parse(localStorage.getItem("historial_10") || "[]");
            logBox.innerHTML = "";
            guardados.forEach(item => {
                logBox.innerHTML += `<div><span style="color:#64748b">[${item.t}]</span> <span style="color:${item.c}">${item.m}</span></div>`;
            });
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Guarda mensajes en el historial (Máximo 10)
        function guardarLog(msg, color) {
            const t = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
            let guardados = JSON.parse(localStorage.getItem("historial_10") || "[]");
            
            // Limpiamos el formato para que se vea bien en pantalla
            const textoLimpio = msg.replace('|', ': ').replace('_', ' ');
            
            guardados.push({ t, m: textoLimpio, c: color });
            if (guardados.length > 10) guardados.shift();
            
            localStorage.setItem("historial_10", JSON.stringify(guardados));
            cargarHistorial();
        }

        function conectar() {
            user = document.getElementById("user").value.trim();
            const p = document.getElementById("pass").value;
            
            if(!user || !p) return alert("Por favor, ingresa usuario y contraseña");

            // Crear cliente con ID único para evitar colisiones
            mqtt = new Paho.MQTT.Client("wss://" + host + ":8884/mqtt", "WebClient_" + Math.random().toString(16).substr(2, 8));

            mqtt.onMessageArrived = (msg) => {
                const payload = msg.payloadString;
                const topic = msg.destinationName;

                // Estado de conexión del ESP32
                if (topic === "esp32/link") {
                    document.getElementById("con-dot").className = "dot" + (payload === "ONLINE" ? " online" : "");
                    document.getElementById("con-text").innerText = "ESP32: " + payload;
                }
                
                // Estado del sistema (Vigilando, Alarma, etc)
                if (topic === "esp32/estado") {
                    const el = document.getElementById("sys-state");
                    el.innerText = payload;
                    el.style.color = (payload.includes("ALARMA") || payload.includes("ERROR")) ? "var(--red)" : (payload.includes("VIGILANDO") ? "var(--blue)" : "var(--orange)");
                }

                // Logs enviados desde el ESP32
                if (topic === "esp32/log") {
                    let c = "#10b981"; // Verde por defecto
                    if(payload.includes("INTRUSION") || payload.includes("ERROR")) c = "#ef4444"; // Rojo para alertas
                    if(payload.includes("OFFLINE")) c = "#f59e0b"; // Naranja para advertencias
                    guardarLog(payload, c);
                }
            };

            mqtt.connect({ 
                useSSL: true, 
                userName: user, 
                password: p, 
                onSuccess: () => {
                    document.getElementById("login").style.display = "none";
                    document.getElementById("panel").style.display = "block";
                    document.getElementById("operator-display").innerText = "OPERADOR: " + user.toUpperCase();
                    
                    cargarHistorial();
                    mqtt.subscribe("esp32/#");
                    
                    // Log de inicio de sesión local
                    guardarLog("SESIÓN INICIADA POR: " + user.toUpperCase(), "var(--blue)");
                },
                onFailure: (e) => alert("Error de conexión: Revisa tus credenciales de HiveMQ")
            });
        }

        function enviar(cmd) {
            if(!mqtt || !mqtt.isConnected()) return alert("No hay conexión con el servidor");

            // Formato de comando: "Usuario:Comando"
            const payload = user + ":" + cmd;
            const m = new Paho.MQTT.Message(payload);
            m.destinationName = "esp32/comando";
            m.qos = 1;
            mqtt.send(m);

            // Registro inmediato en el log local para saber qué hizo el usuario
            let colorAction = "var(--blue)";
            if(cmd === 'ACTIVAR') colorAction = "var(--orange)";
            if(cmd === 'APAGAR') colorAction = "var(--red)";
            
            guardarLog("YO (" + user + "): " + cmd, colorAction);
            
            console.log("Comando enviado: " + payload);
        }
    </script>
</body>
</html>
