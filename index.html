<!DOCTYPE html>
<html>
<head>
    <title>Panel de Control Alarma</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; }
        .card { background: #1e1e1e; border-radius: 15px; padding: 20px; display: inline-block; margin-top: 50px; border: 1px solid #333; }
        .btn-on { background: #27ae60; color: white; padding: 15px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-off { background: #c0392b; color: white; padding: 15px; border: none; border-radius: 5px; cursor: pointer; }
        #status { font-size: 24px; margin: 20px; font-weight: bold; }
        .alerta { color: #f1c40f; animation: blink 1s infinite; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛡️ Mi Alarma Láser</h1>
        <div id="status">ESTADO: DESCONECTADO</div>
        <p>Distancia: <span id="dist">---</span> mm</p>
        <button class="btn-on" onclick="enviar('ON')">ARMAR SISTEMA</button>
        <button class="btn-off" onclick="enviar('OFF')">DESARMAR / RESET</button>
    </div>

    <script>
        // --- CONFIGURA TUS DATOS AQUÍ ---
        const host = "7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud";
        const port = 8884; // PUERTO PARA NAVEGADOR (WSS) ES 8884
        const user = "TU_USUARIO";
        const pass = "TU_PASSWORD";
        const clientId = "web_client_" + Math.random().toString(16).substr(2, 8);

        client = new Paho.MQTT.Client(host, port, clientId);

        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        const options = {
            useSSL: true,
            userName: user,
            password: pass,
            onSuccess: onConnect,
            onFailure: (err) => { console.log("Fallo:", err); }
        };

        client.connect(options);

        function onConnect() {
            console.log("Conectado a HiveMQ");
            document.getElementById("status").innerText = "CONECTADO A LA NUBE";
            client.subscribe("esp32/distancia");
            client.subscribe("esp32/estado");
            client.subscribe("esp32/alarma_activada");
        }

        function onConnectionLost(responseObject) {
            document.getElementById("status").innerText = "CONEXIÓN PERDIDA";
        }

        function onMessageArrived(message) {
            if (message.destinationName == "esp32/distancia") {
                document.getElementById("dist").innerText = message.payloadString;
            }
            if (message.destinationName == "esp32/estado") {
                document.getElementById("status").innerText = message.payloadString;
            }
        }

        function enviar(msg) {
            let message = new Paho.MQTT.Message(msg);
            message.destinationName = "esp32/comando";
            client.send(message);
        }
    </script>
</body>
</html>
