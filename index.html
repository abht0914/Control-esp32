<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Seguridad Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; text-align: center; width: 320px; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
        /* Este es el ID importante */
        #distancia-texto { font-size: 5rem; color: #10b981; font-weight: bold; margin: 10px 0; display: block; }
        .label { color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 90%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
        .btn { width: 100%; padding: 12px; background: #10b981; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="login-box" class="card">
        <h2>🔒 Seguridad</h2>
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="pass" placeholder="Contraseña">
        <button class="btn" onclick="conectar()">ENTRAR</button>
    </div>

    <div id="panel" class="card hidden">
        <div class="label">Distancia Sensor</div>
        <span id="distancia-texto">0</span>
        <div class="label">milímetros</div>
        <div id="estado-txt" style="margin-top: 20px; color: #f59e0b; font-weight: bold;">SISTEMA ACTIVO</div>
    </div>

    <script>
        let client;
        const HOST = "7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud";

        function conectar() {
            const u = document.getElementById('usuario').value;
            const p = document.getElementById('pass').value;
            const cid = "Web_" + Math.floor(Math.random() * 1000);

            client = new Paho.MQTT.Client("wss://" + HOST + ":8884/mqtt", cid);

            client.onMessageArrived = (msg) => {
                console.log("Datos:", msg.destinationName, "->", msg.payloadString);
                
                // Si el mensaje es de distancia, actualizamos el número grande
                if (msg.destinationName === "esp32/distancia") {
                    document.getElementById("distancia-texto").innerText = msg.payloadString;
                }
                
                // Si el mensaje es de estado (APAGADO/ARMAR)
                if (msg.destinationName === "esp32/estado") {
                    document.getElementById("estado-txt").innerText = "ESTADO: " + msg.payloadString;
                }
            };

            client.connect({
                useSSL: true, userName: u, password: p,
                onSuccess: () => {
                    document.getElementById("login-box").classList.add("hidden");
                    document.getElementById("panel").classList.remove("hidden");
                    // Nos suscribimos a todo para asegurar que no se pierda nada
                    client.subscribe("#");
                    console.log("✅ Suscrito con éxito");
                },
                onFailure: (e) => { alert("Error: " + e.errorMessage); }
            });
        }
    </script>
</body>
</html>
