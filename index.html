<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Seguridad IoT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --green: #10b981; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: var(--card); padding: 2.5rem; border-radius: 1.5rem; text-align: center; width: 340px; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        #dist-texto { font-size: 5rem; color: var(--green); font-weight: bold; margin: 15px 0; display: block; transition: all 0.3s; }
        .unit { color: #94a3b8; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; background: var(--green); border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .status { font-size: 0.75rem; margin-bottom: 1.5rem; color: #94a3b8; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="login-box" class="card">
        <h2>🔒 Panel Control</h2>
        <p style="font-size: 0.8rem; color: #94a3b8;">Ingresa un Usuario de HiveMQ</p>
        <input type="text" id="user" placeholder="Usuario">
        <input type="password" id="pass" placeholder="Contraseña">
        <button class="btn" onclick="conectarMQTT()">CONECTAR PANEL</button>
    </div>

    <div id="panel" class="card hidden">
        <div id="conn-state" class="status">● ESTABLECIENDO CONEXIÓN...</div>
        <span class="unit">Distancia</span>
        <span id="dist-texto">0</span>
        <span class="unit">milímetros</span>
        <div id="msg-log" style="font-size: 0.7rem; color: #475569; margin-top: 20px;">Esperando datos del ESP32...</div>
    </div>

    <script>
        let client;
        const HOST = "7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud";

        function conectarMQTT() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            const clientId = "WebClient_" + Math.floor(Math.random() * 10000);

            client = new Paho.MQTT.Client("wss://" + HOST + ":8884/mqtt", clientId);

            client.onMessageArrived = (msg) => {
                console.log("Recibido:", msg.destinationName, "->", msg.payloadString);
                
                if (msg.destinationName === "esp32/distancia") {
                    const el = document.getElementById("dist-texto");
                    el.innerText = msg.payloadString;
                    // Efecto de pulso suave al recibir dato
                    el.style.transform = "scale(1.05)";
                    setTimeout(() => el.style.transform = "scale(1)", 100);
                    document.getElementById("msg-log").innerText = "Sincronizado: " + new Date().toLocaleTimeString();
                }
            };

            client.onConnectionLost = (e) => {
                document.getElementById("conn-state").innerText = "❌ CONEXIÓN PERDIDA";
                document.getElementById("conn-state").style.color = "#ef4444";
            };

            client.connect({
                useSSL: true, userName: u, password: p,
                onSuccess: () => {
                    document.getElementById("login-box").classList.add("hidden");
                    document.getElementById("panel").classList.remove("hidden");
                    document.getElementById("conn-state").innerText = "● PANEL EN LÍNEA";
                    document.getElementById("conn-state").style.color = "#10b981";
                    // Suscribirse a todo
                    client.subscribe("#");
                },
                onFailure: (e) => { alert("Error: " + e.errorMessage); }
            });
        }
    </script>
</body>
</html>
