<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Seguridad Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; width: 400px; border: 1px solid #334155; }
        #dist { font-size: 3.5rem; color: #10b981; font-weight: bold; margin: 20px 0; }
        .btn { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .hidden { display: none; }
        input { width: 80%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; }
    </style>
</head>
<body>

    <div id="login-box" class="card">
        <h2>🔐 Acceso HiveMQ</h2>
        <input type="text" id="u" placeholder="Usuario (Esp-32)">
        <input type="password" id="p" placeholder="Password (Controltotal1)">
        <button class="btn" style="background:#10b981; margin-top:10px;" onclick="login()">ENTRAR</button>
    </div>

    <div id="main-panel" class="hidden">
        <div class="card">
            <div id="conn-tag" style="font-size: 0.7rem; color: #94a3b8;">DESCONECTADO</div>
            <div id="dist">Esperando...</div>
            <div id="stat" style="color: #f59e0b; margin-bottom: 15px;">---</div>
            
            <button class="btn" style="background:#10b981;" onclick="enviar('ARMAR')">🛡️ ARMAR</button>
            <button class="btn" style="background:#ef4444;" onclick="enviar('APAGAR')">✖️ RESET</button>
        </div>
    </div>

    <script>
        let mqtt;
        let user;
        // URL de tu imagen:
        const host = "7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud";

        function login() {
            user = document.getElementById("u").value;
            let pass = document.getElementById("p").value;

            // IMPORTANTE: ClientID único para evitar que el ESP32 y la Web se pateen entre sí
            const clientId = "WebClient_" + Math.random().toString(16).substr(2, 5);
            
            // Ruta obligatoria para HiveMQ: /mqtt
            mqtt = new Paho.MQTT.Client("wss://" + host + ":8884/mqtt", clientId);

            mqtt.onMessageArrived = (m) => {
                console.log("Mensaje recibido en:", m.destinationName, "Contenido:", m.payloadString);
                
                if (m.destinationName === "esp32/distancia") {
                    document.getElementById("dist").innerText = m.payloadString + " mm";
                }
                if (m.destinationName === "esp32/estado") {
                    document.getElementById("stat").innerText = m.payloadString;
                }
            };

            mqtt.onConnectionLost = (e) => {
                document.getElementById("conn-tag").innerText = "❌ CONEXIÓN PERDIDA";
                console.log("Error:", e);
            };

            const options = {
                useSSL: true,
                userName: user,
                password: pass,
                onSuccess: () => {
                    console.log("✅ Web Conectada");
                    document.getElementById("login-box").classList.add("hidden");
                    document.getElementById("main-panel").classList.remove("hidden");
                    document.getElementById("conn-tag").innerText = "● EN LÍNEA";
                    document.getElementById("conn-tag").style.color = "#10b981";

                    // Suscripción explícita
                    mqtt.subscribe("esp32/distancia");
                    mqtt.subscribe("esp32/estado");
                },
                onFailure: (e) => {
                    alert("Fallo de conexión: " + e.errorMessage);
                }
            };

            mqtt.connect(options);
        }

        function enviar(acc) {
            let m = new Paho.MQTT.Message(user + ":" + acc);
            m.destinationName = "esp32/comando";
            mqtt.send(m);
        }
    </script>
</body>
</html>
