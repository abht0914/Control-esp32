<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Control Alarma</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #121212; color: white; text-align: center; font-family: sans-serif; padding-top: 50px; }
        .box { border: 2px solid #00ff88; display: inline-block; padding: 20px; border-radius: 15px; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; font-weight: bold; border-radius: 5px; border: none; }
        .on { background: #27ae60; color: white; }
        .off { background: #e74c3c; color: white; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🛡️ SISTEMA LÁSER</h1>
        <p id="stat">ESTADO: CONECTANDO...</p>
        <p>Distancia: <span id="dist">0</span> mm</p>
        <button class="on" onclick="enviar('ON')">ARMAR</button>
        <button class="off" onclick="enviar('OFF')">DESARMAR</button>
    </div>

    <script>
        const client = new Paho.MQTT.Client("7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud", 8884, "web_" + Math.random().toString(16).substr(2, 8));
        
        client.onMessageArrived = (msg) => {
            if (msg.destinationName == "esp32/distancia") document.getElementById("dist").innerText = msg.payloadString;
            if (msg.destinationName == "esp32/estado") document.getElementById("stat").innerText = "ESTADO: " + msg.payloadString;
        };

        client.connect({
            useSSL: true,
            userName: "TU_USUARIO", // PON TU USUARIO DE ACCESS MANAGEMENT
            password: "TU_PASSWORD", // PON TU PASSWORD DE ACCESS MANAGEMENT
            onSuccess: () => {
                document.getElementById("stat").innerText = "ESTADO: CONECTADO";
                client.subscribe("esp32/distancia");
                client.subscribe("esp32/estado");
            }
        });

        function enviar(val) {
            let m = new Paho.MQTT.Message(val);
            m.destinationName = "esp32/comando";
            client.send(m);
        }
    </script>
</body>
</html>
