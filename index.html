<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Seguridad Rápido</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 15px; border: 1px solid #334155; text-align: center; width: 380px; }
        #dist { font-size: 4rem; color: #10b981; font-weight: bold; margin: 10px 0; transition: all 0.2s; }
        .btn { width: 100%; padding: 15px; cursor: pointer; border-radius: 10px; border: none; font-weight: bold; margin: 10px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="login-box" class="card">
        <h2>🔐 Acceso</h2>
        <input type="text" id="u" placeholder="Usuario" style="width:80%; padding:10px; margin:5px;">
        <input type="password" id="p" placeholder="Password" style="width:80%; padding:10px; margin:5px;">
        <button class="btn" style="background:#10b981; color:white;" onclick="login()">ENTRAR</button>
    </div>

    <div id="main-panel" class="card hidden">
        <h3 id="user-tag">OPERADOR</h3>
        <div id="stat" style="color:#f59e0b">CONECTANDO...</div>
        <div id="dist">0 mm</div>
        <button class="btn" style="background:#10b981; color:white;" onclick="enviar('ARMAR')">🛡️ ARMAR</button>
        <button class="btn" style="background:#f59e0b; color:white;" onclick="enviar('ACTIVAR')">🚨 PÁNICO</button>
        <button class="btn" style="background:#ef4444; color:white;" onclick="enviar('APAGAR')">✖️ RESET</button>
        <ul id="logList" style="text-align:left; font-size:0.7rem; max-height:100px; overflow-y:auto;"></ul>
    </div>

    <script>
        let mqtt; let user;
        const host = "7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud";

        function login() {
            user = document.getElementById("u").value;
            let pass = document.getElementById("p").value;
            mqtt = new Paho.MQTT.Client(host, 8884, "web_" + Math.random().toString(16).substr(2, 4));
            
            mqtt.onMessageArrived = (m) => {
                if(m.destinationName == "esp32/distancia") document.getElementById("dist").innerText = m.payloadString + " mm";
                if(m.destinationName == "esp32/estado") document.getElementById("stat").innerText = m.payloadString;
                if(m.destinationName == "esp32/log") {
                    let li = document.createElement("li");
                    li.innerText = `[${new Date().toLocaleTimeString()}] ${m.payloadString}`;
                    document.getElementById("logList").prepend(li);
                }
            };

            mqtt.connect({ useSSL: true, userName: user, password: pass,
                onSuccess: () => {
                    document.getElementById("login-box").classList.add("hidden");
                    document.getElementById("main-panel").classList.remove("hidden");
                    document.getElementById("user-tag").innerText = "OPERADOR: " + user.toUpperCase();
                    mqtt.subscribe("esp32/distancia");
                    mqtt.subscribe("esp32/log");
                    mqtt.subscribe("esp32/estado");
                }
            });
        }

        function enviar(acc) {
            let m = new Paho.MQTT.Message(user + ":" + acc);
            m.destinationName = "esp32/comando";
            mqtt.send(m);
        }
    </script>
</body>
</html>
