<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Seguridad</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
        #dist { font-size: 4rem; color: #10b981; margin: 20px 0; font-weight: bold; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
        .btn { width: 100%; padding: 12px; background: #10b981; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .status { font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="login-box" class="card">
        <h2>🔐 Login HiveMQ</h2>
        <input type="text" id="u" placeholder="Usuario (Ej: Usuario1)">
        <input type="password" id="p" placeholder="Contraseña">
        <button class="btn" onclick="conectar()">CONECTAR PANEL</button>
    </div>

    <div id="panel" class="card" style="display:none;">
        <div id="state" class="status">● CONECTANDO...</div>
        <div style="color: #94a3b8; font-size: 0.9rem;">Distancia del Sensor:</div>
        <div id="dist">0 mm</div>
        <button class="btn" style="background:#ef4444;" onclick="location.reload()">DESCONECTAR</button>
    </div>

    <script>
        let client;
        const host = "7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud";

        function conectar() {
            const user = document.getElementById("u").value;
            const pass = document.getElementById("p").value;
            const clientId = "Web_User_" + Math.floor(Math.random() * 10000);

            // USANDO URL Y PUERTO EXACTOS DE TU IMAGEN
            client = new Paho.MQTT.Client("wss://" + host + ":8884/mqtt", clientId);

            client.onMessageArrived = (msg) => {
                if (msg.destinationName === "esp32/distancia") {
                    document.getElementById("dist").innerText = msg.payloadString + " mm";
                }
            };

            client.onConnectionLost = (e) => {
                document.getElementById("state").innerText = "❌ DESCONECTADO";
                console.log("Error:", e);
            };

            client.connect({
                useSSL: true,
                userName: user,
                password: pass,
                onSuccess: () => {
                    document.getElementById("login-box").style.display = "none";
                    document.getElementById("panel").style.display = "block";
                    document.getElementById("state").innerText = "● EN LÍNEA";
                    document.getElementById("state").style.color = "#10b981";
                    
                    // Suscribirse al tópico que el Arduino publica
                    client.subscribe("esp32/distancia");
                },
                onFailure: (e) => {
                    alert("Error: " + e.errorMessage);
                }
            });
        }
    </script>
</body>
</html>
