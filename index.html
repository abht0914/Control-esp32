<script>
    let client;
    let alarmStatus = false;

    // Cargar historial guardado al abrir la página
    document.addEventListener('DOMContentLoaded', () => {
        const savedHistory = JSON.parse(localStorage.getItem('alarma_historial')) || [];
        const lista = document.getElementById('history-list');
        savedHistory.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = item;
            lista.appendChild(div);
        });
    });

    function connectMQTT() {
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;

        const options = {
            username: user, password: pass,
            clientId: 'web_alarm_' + Math.random().toString(16).substr(2, 4),
            clean: true
        };

        const clusterUrl = 'wss://7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud:8884/mqtt';
        client = mqtt.connect(clusterUrl, options);

        client.on('connect', () => {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('control-section').classList.remove('hidden');
            document.getElementById('conn-status').innerText = "● PROTECCIÓN ACTIVA";
            document.getElementById('conn-status').className = "status online";
            
            client.subscribe('esp32/estado');
            client.subscribe('esp32/alarma_activada');
        });

        client.on('message', (topic, message) => {
            if(topic === 'esp32/estado') {
                alarmStatus = (message.toString() === 'ON');
                updateUI();
            }
            if(topic === 'esp32/alarma_activada') {
                agregarAlHistorial();
            }
        });
    }

    function agregarAlHistorial() {
        const lista = document.getElementById('history-list');
        const ahora = new Date();
        const fechaHora = ahora.toLocaleDateString() + " " + ahora.toLocaleTimeString();
        const textoHtml = `<span>⚠ DISPARO:</span> ${fechaHora}`;
        
        const nuevoRegistro = document.createElement('div');
        nuevoRegistro.className = 'history-item';
        nuevoRegistro.innerHTML = textoHtml;
        
        // Añadir al inicio de la lista visual
        lista.insertBefore(nuevoRegistro, lista.firstChild);

        // --- LÓGICA DE BASE DE DATOS LOCAL ---
        let historial = JSON.parse(localStorage.getItem('alarma_historial')) || [];
        historial.unshift(textoHtml); // Añade al inicio del array
        if(historial.length > 10) historial.pop(); // Mantiene solo los últimos 10
        localStorage.setItem('alarma_historial', JSON.stringify(historial));

        // Limitar la lista visual a 10 elementos
        while (lista.children.length > 10) {
            lista.removeChild(lista.lastChild);
        }
    }

    function toggleLED() {
        const command = alarmStatus ? 'OFF' : 'ON';
        client.publish('esp32/comando', command, { qos: 1 });
    }

    function updateUI() {
        const btn = document.getElementById('btn-led');
        const txt = document.getElementById('text-state');
        if(alarmStatus) {
            btn.classList.add('led-on');
            txt.innerText = "SISTEMA ARMADO";
            txt.style.color = "#ff4444";
        } else {
            btn.classList.remove('led-on');
            txt.innerText = "SISTEMA DESARMADO";
            txt.style.color = "#555";
        }
    }
</script>
