<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Estable</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; text-align: center; width: 300px; border: 1px solid #334155; }
        #valor { font-size: 5rem; color: #10b981; font-weight: bold; transition: all 0.2s; }
    </style>
</head>
<body>

    <div id="login" class="card">
        <input type="text" id="u" placeholder="Usuario" style="width:80%; padding:10px; margin:5px;">
        <input type="password" id="p" placeholder="Clave" style="width:80%; padding:10px; margin:5px;">
        <button onclick="conectar()" style="width:86%; padding:10px; background:#10b981; border:none; color:white; font-weight:bold; cursor:pointer;">ENTRAR</button>
    </div>

    <div id="panel" class="card" style="display:none;">
        <div style="color:#94a3b8; font-size:0.8rem;">DISTANCIA</div>
        <div id="valor">0</div>
        <div id="status" style="font-size:0.7rem; color:#475569;">Sincronizado</div>
    </div>

    <script>
        let mqtt;
        function conectar() {
            const user = document.getElementById("u").value;
            const pass = document.getElementById("p").value;
            mqtt = new Paho.MQTT.Client("wss://7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud:8884/mqtt", "Web_" + Math.random());

            mqtt.onMessageArrived = (msg) => {
                if (msg.destinationName === "esp32/distancia") {
                    const el = document.getElementById("valor");
                    el.innerText = msg.payloadString;
                    // Pequeño efecto visual para confirmar que llegó el dato
                    el.style.opacity = "0.5";
                    setTimeout(() => el.style.opacity = "1", 100);
                }
            };

            mqtt.connect({
                useSSL: true, userName: user, password: pass,
                onSuccess: () => {
                    document.getElementById("login").style.display = "none";
                    document.getElementById("panel").style.display = "block";
                    mqtt.subscribe("esp32/distancia");
                }
            });
        }
    </script>
</body>
</html>
