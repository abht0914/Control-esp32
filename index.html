<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Seguridad Aislada</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; transition: background 0.5s; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; border: 1px solid #334155; width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #dist { font-size: 5rem; font-weight: bold; color: #10b981; margin: 10px 0; text-shadow: 0 0 15px rgba(16,185,129,0.3); }
        .status-box { padding: 10px; border-radius: 10px; background: #0f172a; margin-bottom: 20px; font-weight: bold; color: #f59e0b; border: 1px solid #334155; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin: 8px 0; color: white; transition: 0.2s; }
        .btn-arm { background: #10b981; } .btn-panic { background: #f59e0b; } .btn-off { background: #ef4444; }
        .btn:active { transform: scale(0.95); }
        .alarm-active { background: #450a0a !important; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login" class="card">
        <h2>🔒 ACCESO</h2>
        <input type="text" id="u" placeholder="Usuario HiveMQ" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; background:#0f172a; color:white; border:1px solid #334155;">
        <input type="password" id="p" placeholder="Contraseña" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; background:#0f172a; color:white; border:1px solid #334155;">
        <button class="btn btn-arm" onclick="conectar()">INGRESAR</button>
    </div>

    <div id="panel" class="card hidden">
        <div id="state-txt" class="status-box">SISTEMA INICIALIZANDO...</div>
        <div id="dist">--</div>
        <div style="color: #64748b; font-size: 0.8rem; margin-bottom: 20px;">LECTURA LÁSER (mm)</div>
        
        <button class="btn btn-arm" onclick="enviar('ARMAR')">🛡️ ARMAR</button>
        <button class="btn btn-panic" onclick="enviar('ACTIVAR')">🚨 PÁNICO</button>
        <button class="btn btn-off" onclick="enviar('APAGAR')">✖️ DESACTIVAR</button>
    </div>

    <script>
        let client;
        let user;

        function conectar() {
            user = document.getElementById('u').value;
            let pass = document.getElementById('p').value;
            client = new Paho.MQTT.Client("7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud", 8884, "web_" + Math.random().toString(16).substr(2,4));

            client.onMessageArrived = (m) => {
                if(m.destinationName == "esp32/distancia") document.getElementById('dist').innerText = m.payloadString;
                if(m.destinationName == "esp32/estado") {
                    document.getElementById('state-txt').innerText = m.payloadString;
                    if(m.payloadString.includes("ALARMA")) document.body.classList.add('alarm-active');
                    else document.body.classList.remove('alarm-active');
                }
            };

            client.connect({
                useSSL: true, userName: user, password: pass,
                onSuccess: () => {
                    document.getElementById('login').classList.add('hidden');
                    document.getElementById('panel').classList.remove('hidden');
                    client.subscribe("esp32/distancia");
                    client.subscribe("esp32/estado");
                },
                onFailure: () => alert("Error al conectar")
            });
        }

        function enviar(cmd) {
            let m = new Paho.MQTT.Message(user + ":" + cmd);
            m.destinationName = "esp32/comando";
            client.send(m);
        }
    </script>
</body>
</html>
