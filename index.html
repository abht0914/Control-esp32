<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Seguridad Avanzado</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .hidden { display: none !important; }
        #login-box { background: #1e293b; padding: 30px; border-radius: 15px; text-align: center; width: 320px; border: 1px solid #334155; }
        #main-panel { width: 95%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; border: 1px solid #334155; text-align: center; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; }
        .btn { width: 100%; padding: 15px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; margin: 5px 0; font-size: 1rem; }
        .btn-arm { background: #10b981; color: white; } /* Verde */
        .btn-act { background: #f59e0b; color: white; } /* Naranja */
        .btn-off { background: #ef4444; color: white; } /* Rojo */
        #dist { font-size: 3.5rem; color: #10b981; font-weight: bold; margin: 10px 0; }
        ul { list-style: none; padding: 10px; background: #0f172a; border-radius: 10px; text-align: left; max-height: 250px; overflow-y: auto; }
        li { font-size: 0.85rem; padding: 8px; border-bottom: 1px solid #334155; color: #cbd5e1; }
        li:first-child { color: #10b981; font-weight: bold; border-left: 3px solid #10b981; padding-left: 10px; }
    </style>
</head>
<body>

    <div id="login-box">
        <h2>🔐 Acceso al Sistema</h2>
        <input type="text" id="u" placeholder="Usuario HiveMQ">
        <input type="password" id="p" placeholder="Contraseña">
        <button class="btn btn-arm" onclick="login()">INGRESAR</button>
        <p id="err" style="color: #ef4444; font-size: 0.8rem;"></p>
    </div>

    <div id="main-panel" class="hidden">
        <div class="card">
            <h3 id="user-tag">Operador: ---</h3>
            <div id="stat" style="color: #f59e0b; font-weight: bold;">ESPERANDO ESTADO...</div>
            <div id="dist">0 mm</div>
            
            <button class="btn btn-arm" onclick="enviar('ARMAR')">🛡️ ARMAR VIGILANCIA</button>
            <button class="btn btn-act" onclick="enviar('ACTIVAR')">🚨 ACTIVAR ALARMA</button>
            <button class="btn btn-off" onclick="enviar('APAGAR')">✖️ APAGAR / RESET</button>
        </div>

        <div class="card">
            <h4>Historial Global (Últimos 10)</h4>
            <ul id="logList"><li>Sincronizando...</li></ul>
        </div>
    </div>

    <script>
        let mqtt;
        let user;
        let logs = [];
        const host = "7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud";

        function login() {
            user = document.getElementById("u").value;
            let pass = document.getElementById("p").value;
            if(!user || !pass) return;

            mqtt = new Paho.MQTT.Client(host, 8884, "web_" + Math.random().toString(16).substr(2, 5));
            
            mqtt.onMessageArrived = (m) => {
                if(m.destinationName == "esp32/distancia") {
                    document.getElementById("dist").innerText = m.payloadString + " mm";
                }
                if(m.destinationName == "esp32/log") {
                    logs.unshift(new Date().toLocaleTimeString() + " - " + m.payloadString);
                    if(logs.length > 10) logs.pop();
                    document.getElementById("logList").innerHTML = logs.map(l => `<li>${l}</li>`).join("");
                }
                if(m.destinationName == "esp32/estado") {
                    document.getElementById("stat").innerText = m.payloadString;
                }
            };

            mqtt.connect({
                useSSL: true, userName: user, password: pass,
                onSuccess: () => {
                    document.getElementById("login-box").className = "hidden";
                    document.getElementById("main-panel").classList.remove("hidden");
                    document.getElementById("user-tag").innerText = "Operador: " + user;
                    mqtt.subscribe("esp32/distancia");
                    mqtt.subscribe("esp32/log");
                    mqtt.subscribe("esp32/estado");
                },
                onFailure: () => { document.getElementById("err").innerText = "Credenciales incorrectas"; }
            });
        }

        function enviar(acc) {
            let m = new Paho.MQTT.Message(user + ":" + acc);
            m.destinationName = "esp32/comando";
            mqtt.send(m);
        }
    </script>
</body>
</html>
