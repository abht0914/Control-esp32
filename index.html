<script>
        let mqtt;
        let user = "";
        const host = "7340fcf31a5f4b45984049723fa706e8.s1.eu.hivemq.cloud";

        // --- FUNCIÓN PARA CARGAR LOGS GUARDADOS ---
        function cargarHistorial() {
            const logContainer = document.getElementById("log");
            const guardados = JSON.parse(localStorage.getItem("historial_seguridad") || "[]");
            
            logContainer.innerHTML = ""; // Limpiar vista actual
            guardados.forEach(item => {
                logContainer.innerHTML += `<div><span style="color:#64748b">[${item.hora}]</span> <span style="color:${item.color}">${item.texto}</span></div>`;
            });
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // --- FUNCIÓN PARA GUARDAR NUEVO LOG (MÁXIMO 10) ---
        function guardarEnHistorial(texto, color) {
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            let guardados = JSON.parse(localStorage.getItem("historial_seguridad") || "[]");

            // Añadir el nuevo registro al final
            guardados.push({ hora: time, texto: texto, color: color });

            // Si hay más de 10, quitar el primero (el más viejo)
            if (guardados.length > 10) {
                guardados.shift();
            }

            // Guardar de vuelta en el navegador
            localStorage.setItem("historial_seguridad", JSON.stringify(guardados));
            
            // Refrescar la vista
            cargarHistorial();
        }

        function conectar() {
            user = document.getElementById("user").value;
            const p = document.getElementById("pass").value;
            if(!user) return alert("Ingresa tu nombre");

            mqtt = new Paho.MQTT.Client("wss://" + host + ":8884/mqtt", "Web_" + Math.random());

            mqtt.onMessageArrived = (msg) => {
                const payload = msg.payloadString;
                const topic = msg.destinationName;

                if (topic === "esp32/link") {
                    const isOnline = payload === "ONLINE";
                    document.getElementById("con-dot").className = "dot" + (isOnline ? " online" : "");
                    document.getElementById("con-text").innerText = "ESP32: " + (isOnline ? "CONECTADO" : "DESCONECTADO");
                }

                if (topic === "esp32/estado") {
                    const stateEl = document.getElementById("sys-state");
                    stateEl.innerText = payload;
                    if(payload.includes("ALARMA") || payload.includes("ERROR")) stateEl.style.color = "var(--red)";
                    else if(payload.includes("VIGILANDO")) stateEl.style.color = "var(--blue)";
                    else stateEl.style.color = "var(--orange)";
                }

                if (topic === "esp32/log") {
                    let color = "#10b981"; 
                    if(payload.includes("INTRUSION") || payload.includes("ERROR")) color = "#ef4444";
                    if(payload.includes("OFFLINE")) color = "#f59e0b";

                    const textoFormateado = payload.replace('|', ': ').replace('_', ' ');
                    
                    // Guardar y mostrar
                    guardarEnHistorial(textoFormateado, color);
                }
            };

            mqtt.connect({ useSSL: true, userName: user, password: p, 
                onSuccess: () => {
                    document.getElementById("login").style.display = "none";
                    document.getElementById("panel").style.display = "block";
                    
                    // Cargar lo que había guardado antes de conectar
                    cargarHistorial();

                    mqtt.subscribe("esp32/link");
                    mqtt.subscribe("esp32/estado");
                    mqtt.subscribe("esp32/log");
                },
                onFailure: (e) => alert("Error de conexión: Verifica tus credenciales.")
            });
        }

        function enviar(cmd) {
            if(!mqtt || !mqtt.isConnected()) return alert("No hay conexión MQTT");
            const m = new Paho.MQTT.Message(user + ":" + cmd);
            m.destinationName = "esp32/comando";
            mqtt.send(m);
            if(cmd === "APAGAR") document.getElementById("sys-state").innerText = "APAGANDO...";
        }
    </script>
